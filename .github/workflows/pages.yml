name: Deploy to GitHub Pages
on: {push: {branches: [main]}, workflow_dispatch: {}}
permissions: {contents: read, pages: write, id-token: write}
concurrency: {group: pages, cancel-in-progress: true}
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: {name: github-pages, url: "${{ steps.d.outputs.page_url }}"}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # The browser extension lives in extension/ and is sold in the stores.
      # It is not part of the public website, so it never goes into the Pages artifact.
      - name: Leave the extension out of the public site
        run: rm -rf extension
      - uses: actions/upload-pages-artifact@v3
        with: {path: .}
      - id: d
        uses: actions/deploy-pages@v4
      - name: Ping IndexNow (Bing, Yandex) with sitemap URLs
        continue-on-error: true
        run: sleep 30 && python3 scripts/indexnow.py
